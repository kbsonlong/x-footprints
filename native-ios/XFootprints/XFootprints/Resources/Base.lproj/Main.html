<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../Style.css">
    <title>X Footprints</title>
</head>
<body>
    <main>
        <h1>X Footprints</h1>
        <p>在 Safari 中自动记录打开的 X 帖子，数据保存在本机。</p>
        <h2>启用扩展</h2>
        <ol>
            <li>打开系统“设置”，找到 Safari 的“扩展”设置。</li>
            <li>打开 X Footprints，并允许它访问 x.com。</li>
            <li>在 Safari 打开 X 的帖子详情，点击地址栏旁的扩展按钮查看记录。</li>
        </ol>
        <p class="note">设置位置可能随 iOS 版本变化。扩展只能记录 Safari 中的访问，不能记录 X App 中的浏览。</p>
    </main>
</body>
</html>
